# Employers read directly from their own careers systems (earliest + most
# reliable source). Every entry below was verified to respond when it was added (2026-10-21 to 10-28).
# Anyone not listed is still covered through LinkedIn and Indeed.
#
# To add one: find a job on their careers site and look at the URL.
#   https://TENANT.wdN.myworkdayjobs.com/SITE/job/...   -> workday
#   https://boards.greenhouse.io/SLUG or job-boards...   -> greenhouse
#   https://jobs.lever.co/SLUG                           -> lever
#   https://jobs.ashbyhq.com/SLUG                        -> ashby
#   https://careers.X.com/job/...  (SAP SuccessFactors)  -> successfactors (domain)
# Optional `company:` = the employer's name when it differs from `name` (two sites, one employer).

workday:
  # Workday has no reliable "newest first" sort, so we search these words
  # and take every result; already-seen jobs are skipped cheaply.
  search_terms: ["British Columbia", "Vancouver", "Remote Canada"]
  sites:
    - {name: RBC, tenant: rbc, wd: wd3, site: RBCGLOBAL1}
    - {name: TD, tenant: td, wd: wd3, site: TD_Bank_Careers}
    - {name: BMO, tenant: bmo, wd: wd3, site: External}
    - {name: CIBC, tenant: cibc, wd: wd3, site: search}
