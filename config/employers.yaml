# BC Public Service (all ministries) - read directly from its job board.
bc_public_service: true

# TransLink, SkyTrain (BC Rapid Transit), Coast Mountain Bus and Transit Security - one list for all four.
translink: true

# Federal public service (GC Jobs). Postings stay open for weeks, so it's read every 3 hours.
gcjobs:
  every_hours: 3

